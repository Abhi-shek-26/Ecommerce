{% extends 'Admin/admin_base.html' %}

{% block content %}



 <div class="container-fluid pt-4 px-4">
    <div class="row">
        <div class="col-12 text-center">
            <h1>Sellers</h1>
        </div>
    </div>

<div class="row mt-4">
        <div class="col-12">

<table class="table table-dark table-striped">
    <thead>
        <tr>
            <th>User Name</th>
            <th>Seller Name</th>
            <th>Email</th>
            <th>Contact</th>
            <th> </th>
        </tr>
    </thead>
    <tbody>
        {% for seller in sellers %}
        <tr>
            <td>{{ seller.reg_user.username }}</td>
            <td>{{ seller.seller_name }}</td>
            <td>{{ seller.email }}</td>
            <td>{{ seller.phone_number }}</td>
            <td>
                <a href="{% url 'delete_seller' seller.id%}"
                   class="btn btn-primary"
                                  onclick="return confirm('Are you sure you want to delete this Seller?');">
                                  Delete
                               </a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4" style="text-align:center;">No sellers found</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
        </div>
</div>
 </div>
{% endblock %}
