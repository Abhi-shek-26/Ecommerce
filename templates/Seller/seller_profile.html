{% extends 'Seller/seller_base.html' %}

{% block content %}
<style>
/* Profile Page Styles */
body {
    background-color: rgba(235, 238, 255, 1) !important;
    color: #888ea8;
}

.user-profile .widget-content-area {
    border-radius: 6px;
    border: 1px solid #e0e6ed;
    box-shadow: 0 0 40px 0 rgba(94, 92, 154, 0.06);
    padding: 20px;
    position: relative;
    background-color: #fff;
    border-bottom-left-radius: 8px;
    border-bottom-right-radius: 8px;
    border-top: none;
}

.user-profile .widget-content-area .user-info {
    margin-top: 40px;
    text-align: center;
}

.user-profile .widget-content-area .user-info p {
    font-size: 20px;
    font-weight: 600;
    margin-top: 22px;
    color: #009688;
}

.user-profile .widget-content-area .edit-profile {
    height: 35px;
    width: 35px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(to right, #3cba92 0%, #0ba360 100%);
    border-radius: 50%;
    box-shadow: 0 6px 10px 0 rgba(0,0,0,0.14), 0 1px 18px 0 rgba(0,0,0,0.12), 0 3px 5px -1px rgba(0,0,0,0.2);
}

.user-profile .widget-content-area .edit-profile svg {
    font-size: 17px;
    color: #e0e6ed;
}

.user-profile .widget-content-area .user-info img {
    border-radius: 9px;
    box-shadow: 0 6px 10px 0 rgba(0,0,0,0.14), 0 1px 18px 0 rgba(0,0,0,0.12), 0 3px 5px -1px rgba(0,0,0,0.2);
}

.user-profile .widget-content-area .user-info-list ul.contacts-block {
    border: none;
    max-width: 217px;
    margin: 30px auto 0 auto;
    list-style: none;
    padding: 0;
}

.user-profile .widget-content-area .user-info-list ul.contacts-block li {
    margin-bottom: 13px;
    font-weight: 600;
    font-size: 13px;
}

.user-profile .widget-content-area .user-info-list ul.contacts-block li a:not(.btn) {
    font-weight: 600;
    font-size: 15px;
    color: #009688;
}

.btn svg {
    pointer-events: none;
    height: 22px;
    width: 22px;
    vertical-align: middle;
}

.btn.btn-icon.btn-rounded {
    border-radius: 50%;
}

.btn.btn-icon {
    padding: 7.5px 9px;
}
</style>

<div class="container pt-4">
    <div class="row">
        <div class="col-xl-5 col-lg-12 col-md-12 col-sm-12 layout-top-spacing">
            <div class="user-profile">
                <div class="widget-content widget-content-area">
                    <div class="d-flex justify-content-between align-items-center">
                        <h3>Profile</h3>
                        <a href="{% url 'edit_seller_profile' %}" class="edit-profile">
                            <!-- Edit Icon SVG -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" class="feather feather-edit-3">
                                <path d="M12 20h9"></path>
                                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                            </svg>
                        </a>
                    </div>
                    <div class="text-center user-info">
                        <img src="https://bootdey.com/img/Content/avatar/avatar1.png" alt="avatar">
                        <p>{{ seller_data.seller_name }}</p>
                    </div>
                    <div class="user-info-list text-center">
                        <ul class="contacts-block">
                            <li>
                                <a href="mailto:{{ seller_data.email }}">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round" class="feather feather-mail me-3">
                                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                        <polyline points="22,6 12,13 2,6"></polyline>
                                    </svg>
                                    {{ seller_data.email }}
                                </a>
                            </li>
                            <li>
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" class="feather feather-phone me-3">
                                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                                </svg>
                                {{ seller_data.phone_number }}
                            </li>
                        </ul>
                        <ul class="list-inline mt-4">
                            <li class="list-inline-item mb-0">
                                <a class="btn btn-info btn-icon btn-rounded" href="javascript:void(0);">
                                    <!-- Twitter SVG -->
                                </a>
                            </li>
                            <li class="list-inline-item mb-0">
                                <a class="btn btn-danger btn-icon btn-rounded" href="javascript:void(0);">
                                    <!-- Dribbble SVG -->
                                </a>
                            </li>
                            <li class="list-inline-item mb-0">
                                <a class="btn btn-dark btn-icon btn-rounded" href="javascript:void(0);">
                                    <!-- GitHub SVG -->
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
