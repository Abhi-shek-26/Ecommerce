<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<style>
    .divider:after,
    .divider:before {
        content: "";
        flex: 1;
        height: 1px;
        background: #eee;
    }
</style>

<body>

<section class="vh-100">
    <div class="container py-5 h-100">
        <div class="row d-flex align-items-center justify-content-center h-100">

            <div class="col-md-8 col-lg-7 col-xl-6">
                <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/draw2.svg"
                     class="img-fluid" alt="Login image">
            </div>

            <div class="col-md-7 col-lg-5 col-xl-5 offset-xl-1">

                <form method="POST">
                    {% csrf_token %}

                    <!-- Username -->
                    <div class="form-outline mb-4">
                        <input type="text" class="form-control form-control-lg" name="uname" required>
                        <label class="form-label">User Name</label>
                    </div>

                    <!-- Password -->
                    <div class="form-outline mb-4">
                        <input type="password" class="form-control form-control-lg" name="pass" required>
                        <label class="form-label">Password</label>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" data-mdb-button-init data-mdb-ripple-init class="btn btn-primary btn-lg btn-block">Login</button>
                </form>

                <!-- Divider -->
                <div class="divider d-flex align-items-center my-4">
                    <p class="text-center fw-bold mx-3 mb-0 text-muted">OR</p>
                </div>

                <!-- Register Buttons -->
                <div class="d-grid gap-2">
                    <a href="{% url 'Buyer_add' %}" class="btn btn-outline-success btn-lg">
                        Register as Customer
                    </a>
                    <a href="{% url 'Seller_add' %}" class="btn btn-outline-warning btn-lg">
                        Register as Seller
                    </a>
                </div>

            </div>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
